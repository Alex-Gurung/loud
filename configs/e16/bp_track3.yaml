# E16: track-3 record #5's design (12 x 1,024 with hashed n-gram value embeddings) under backprop, with PR #40's
# recipe at 4 sequences per update: the backprop side of the architecture ranking that e16.h8_track3 and e1.h8_cut
# must reproduce; the fixed model's backprop arm is e1.bp_b4_pr40.
experiment: e16
variant: bp_track3
task: proxy
seeds: [0, 1]
priority: 75
gpu_memory_gb: 48  # the 614M-parameter track-3 model: room for one beside two small jobs on a shared H100
after: [verify.score_record.s0, verify.bp_b8_match.s0, verify.track3_smoke.s0]
args:
  recipe: pr40
  sequences: 10M
  heldout: 32
  batch: 4
  preset: track3
  arch: ngram
