# E16's closer pair (added): the track-3 shape (12 x 1,024) without the n-gram tables, under backprop,
# against e16.bp_track3 (with them): does H8 rank a single architectural feature as backprop does? The official
# scorer builds only the fixed 8 x 512 model or record #5's own shape, so these compare on the held-out loss.
experiment: e16
variant: bp_track3_plain
task: proxy
seeds: [0, 1]
priority: 45
gpu_memory_gb: 32  # a 151M-parameter model
after: [verify.score_record.s0, verify.bp_b8_match.s0]
args:
  sequences: 10M
  heldout: 32
  preset: track3
  official_eval: false
  recipe: pr40
  batch: 4
