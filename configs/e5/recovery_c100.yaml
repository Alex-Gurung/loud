# E5's diagnostic on e1.bp_b4.s0's 100% checkpoint (no training): one 512-probe cycle launched at each token's
# embedding, read at all nine sites, against a direct cycle at each site, both run as PR #40's chain runs them (its
# routed MLP units, its arithmetic) with attention frozen, as the plan says (so without the chain's own-query
# response). Per site: the median cosine between the credit solved from the launched probes' changes there (ridge 0,
# 1e-3 and 0.1 toward the identity-path guess) and the direct cycle's, and the median condition number. With
# recovery_c20, the plan's 9 x 2 table (python3 -m loud.plots e5).
# Decision: cosine >= 0.95 at all sites -> the full version; failing only at the top two or three sites -> the hybrid;
# failing at most sites on the 100% checkpoint -> drop it. The implementation waits for the maintainers' answer to the
# rules question (plan section 6); the diagnostic does not.
experiment: e5
variant: recovery_c100
task: diagnose
seeds: [0]
priority: 70
after: [e1.bp_b4.s0]
args:
  tool: credit_recovery
  checkpoint: e1.bp_b4.s0:ckpt_100.pt
