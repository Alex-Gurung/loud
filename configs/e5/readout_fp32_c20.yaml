# E5's diagnostic in float32 on e1.h8_synth.s0's 20% checkpoint: per token, one 512-probe cycle launched at S1
# through reforward at chain_sigma, read at S2..S8; per site the median condition number and the median cosine of the
# solved credit to the exact credit. readout_c20 runs the same in bf16, where the replay differences whole bf16
# losses and a 1% probe's change sinks under their rounding (its cosines near 0; linearity_check's bf16 rows near 1),
# while the chain's kernels difference the changes themselves (synth_vs_real: 0.998 to 1.000). The decision of plan
# E5 reads these: all sites at 0.95 or above, build; failures at the top two or three, a hybrid; most failing, drop.
experiment: e5
variant: readout_fp32_c20
task: diagnose
seeds: [0]
priority: 20  # the one open diagnostic: first
gpu_memory_gb: 32  # a 512-probe cycle per token chunk through reforward
after: [e1.h8_synth.s0]
args:
  tool: deep_readout_check
  checkpoint: e1.h8_synth.s0:ckpt_20.pt
  precision: float32
