# E17 on the real chain (added after the results review): e17.chain_record's seed 0 again, unchanged. The chain is not
# bit-reproducible on the GPU (chain_record.s0 and chain_keys_b357.s0 share code, seed and Boost yet their Boost losses
# differ by 0.0009 on average), so one-seed chain differences need this repeat's distance from chain_record.s0: the
# noise floor every chain arm's paired difference is read against.
experiment: e17
variant: chain_record_repeat
task: cut
seeds: [0]
priority: 31
gpu_memory_gb: 24  # the Cut chain: 18 GB at its peak
after: [verify.cut_prefix_match.s0]
args:
  sequences: 10M
  heldout: 32
  batch: 4
