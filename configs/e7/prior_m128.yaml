# E7 (H8 synthesis): the identity-path control variate, estimate = p + (1/m) sum_j (v_j . (g - p)) v_j with p the
# top-stream credit carried down the residual scalars (computed, not measured), at m = 128 token-assigned rows. The
# matching no-prior arm is e6.token_k4. Success: the prior at m = 64 within 0.02 of the full cycle (e1.h8_synth).
experiment: e7
variant: prior_m128
task: h8
seeds: [0, 1, 2]
priority: 55
# Not after e7.precondition: its variance ratios (median 0.54 at 50%, 0.56 at 100%) sit just above the 0.5 bar, the
# mid sites S5-S8 below it, and these arms are 6 short H8 runs (review round 8).
after: [verify.score_record.s0, verify.h8_smoke.s0, h6.h8_validation.s0]
args:
  sequences: 10M
  heldout: 32
  rows: 128
  row_assign: token
  prior: identity
