# E7's self-check, as check_045 (see there; the plan runs it only if the best ramp differs between seeds), with
# rows_check 0.77: the error of a guess at cosine 0.7 with the true credit, the plan's "poor guess" mark.
experiment: e7
variant: check_077
task: cut
seeds: [0, 1]
priority: 65
gpu: H100  # wall-clocks compared across experiments (E7 against e6.cut_k1)
after: [verify.score_record.s0, verify.cut_prefix.s0, verify.cut_prefix_match.s0,
        verify.cut_variants_smoke.s0, e7.precondition.s0]
after_done: ['e7.ramp64_f30.s{seed}', 'e7.ramp64_f60.s{seed}', 'e7.ramp128_f30.s{seed}', 'e7.ramp128_f60.s{seed}']
args:
  merge_batch: true  # the merge scores each candidate in one batch: bf16 rounding of close calls only
  sequences: 1M
  heldout: 32
  batch: 4
  rows_start: 64
  rows_full_at: 0.6
  rows_check: 0.77
  heldout_every: 10
  checkpoints: true
