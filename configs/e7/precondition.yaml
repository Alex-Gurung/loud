# E7's diagnostic rule (plan v2): skip the runs if the variance ratio |g - p|^2 / |g|^2 of the identity path's guess
# is above 0.5 from 50% on. Read here as the median over the nine sites of each site's energy ratio, at the 50% and
# 100% checkpoints of e1.h8_synth.s0 (h6.credit_dump). The E7 arms wait for this gate.
experiment: e7
variant: precondition
task: gate
seeds: [0]
priority: 30
after_done: [h6.credit_dump_c50.s0, h6.credit_dump_c100.s0]
args:
  values:
    c50: [h6.credit_dump_c50.s0, credit_dump.json, variance_ratio, S]
    c100: [h6.credit_dump_c100.s0, credit_dump.json, variance_ratio, S]
expect:
  c50: {max: 0.5}
  c100: {max: 0.5}
