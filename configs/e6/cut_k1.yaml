# E6 on the Cut chain (1M slice), K = 1: the unchanged chain, every site's full 512-row cycle each update; the baseline
# of cut_k4 and cut_k16 and of E7's ramps. Every 10 Cut updates, the drift check (a full-cycle estimate on a held-out
# sequence against ANVIL II's momenta) gives the K = 1 reference for the drift cosines. About 35 minutes on one H100.
experiment: e6
variant: cut_k1
task: cut
seeds: [0, 1, 2]
priority: 60
gpu: H100  # wall-clocks compared across experiments (E7 against e6.cut_k1)
after: [verify.score_record.s0, verify.cut_prefix.s0, verify.cut_prefix_match.s0]
args:
  merge_batch: true  # the merge scores each candidate in one batch: bf16 rounding of close calls only
  sequences: 1M
  heldout: 32
  batch: 4
  drift_every: 10
  heldout_every: 10
  checkpoints: true
