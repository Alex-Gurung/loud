# E6's control: 128 rows per update like identity_k4, but every update reads rows [0, 128) of a fresh signed basis
# instead of one cycle's complementary windows. A CPU measurement (review round 2) suggests stitching changes little,
# since each update reads different sequences; this cell says whether identity_k4's result comes from the stitching or
# just from 1/4 of the rows.
experiment: e6
variant: identity_k4_fresh
task: identity
seeds: [0, 1, 2]
priority: 60
after: [verify.score_record.s0, verify.identity.s0, verify.identity_match.s0]
args:
  sequences: 10M
  heldout: 32
  batch: 8
  rows: 128
  row_offset_per_step: false
  drift_every: 50
  heldout_every: 50
  checkpoints: true
  means: true
