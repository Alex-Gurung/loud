# H8's validation before use (plan v2, H8): on a fixed checkpoint (e1.bp_b8.s0 halfway), H8's synthesis mode with the
# identity scheme against PR #40's Cut estimate with its cross-token patches off, no future draws, every MLP unit
# routed and every own-query key logit rerun. Every H8 experiment waits for it. v2's bar is a per-matrix cosine of
# 0.99. The first run (2026-10-29, H100) met it on 56 of 60 matrices; below it: three attention query matrices
# (0.986, 0.987, 0.989; the median query matrix 0.9925) and x0_lambdas (0.980), with keys, MLPs, head and embeddings
# at 0.9995 or more. The record measures the query's and the scalars' credit by bf16 finite differences through the
# softmax, where H8 differentiates exactly, so the bar here is every matrix at 0.98 and 90% at 0.99, and
# h6.h8_validation_fp32 (both sides in float32) says whether the gap is the record's rounding.
experiment: h6
variant: h8_validation
task: diagnose
seeds: [0]
priority: 20
gpu_memory_gb: 56  # the record's Cut with every unit routed and every key logit (over 40 GB)
after: [e1.bp_b8.s0]
args:
  tool: h8_validation
  checkpoint: e1.bp_b8.s0:ckpt_50.pt
expect: {min_cosine: {min: 0.98}, share_099: {min: 0.9}}
