# Runs before the long Cut-chain jobs: a complete short run (96 sequences: 64 feed 16 updates of 4, 3 of them Boost; 32
# score the end merge) of PR #40's chain at 128 token-assigned rows per site with the identity-path prior (E7's
# control variate), H4, the end merge and official scoring of the merged and plain weights. About 20 minutes on one
# H100, most of it the warmup of the chain's shapes and the end merge.
experiment: verify
variant: cut_smoke
task: cut
seeds: [0]
priority: 3
after: [verify.smoke.s0]
args:
  sequences: 96
  heldout: 32
  batch: 4
  rows: 128
  row_assign: token
  prior: identity
  checkpoints: true
notes: Pipeline check only; its numbers are not a result.
