# The Cut-chain port against PR #40's published 8-GPU log (unrounded per-update losses), over the 262 updates of
# cut_prefix. Same weights, data and draws, so the two differ only by float rounding: the order of the 8-way gradient
# sum (NCCL's ring here against rank order) and the kernels of the image's torch against the record's 2.10. Held to
# 0.003 over the first 20 updates (the plan's steps 2 and 10) and to the plan's seed noise, 0.01, over all 262 (step
# 100, and 20 Cut updates). No measurement sets these yet: they are relaxed only after a GPU run measures the drift
# between identical references, cut_prefix_reversed_match (the same run with the sum in reversed rank order).
experiment: verify
variant: cut_prefix_match
task: compare
seeds: [0]
priority: 66
after_done: [verify.cut_prefix.s0]  # runs even when the prefix run failed a check: it says why
args:
  a: verify.cut_prefix.s0
  b: [noise, archive/10M/train/val/log/metrics.jsonl]
  first: 20
expect:
  train_loss_max_diff: [0, 0.003]
  train_loss_max_diff_all: [0, 0.01]
