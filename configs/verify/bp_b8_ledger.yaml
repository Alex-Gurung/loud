# verify.bp_b8 (one GPU, one sequence per forward) against boost-cut's published 8-GPU log of the same script and seed
# (ledger bp38_s0: train loss every 61 updates). The first run (2026-10-29, H100, torch 2.13) differs by +0.0012,
# +0.0012, +0.0017, -0.0027, -0.0005, -0.0112, -0.0077, -0.0016, -0.0038, +0.0025 at updates 61..610 (final val
# 3.70762 against 3.70835): the sign wanders, as rounding (torch 2.13 against the ledger's, one GPU's sum against
# eight) does over hundreds of updates, while the unmodified script and the proxy agree on this GPU
# (verify.bp_b8_match). So the bound is 0.02 at any logged update and 0.005 on the mean; a port error drifts one way.
experiment: verify
variant: bp_b8_ledger
task: compare
seeds: [0]
priority: 10
after_done: [verify.bp_b8.s0]  # runs even when a final-loss gate failed: it says why
args:
  a: verify.bp_b8.s0
  b: [boost-cut, ledger/logs/bp38_s0.log]
expect:
  train_loss_max_diff: [0, 0.02]
  train_loss_mean_diff: [0, 0.005]
