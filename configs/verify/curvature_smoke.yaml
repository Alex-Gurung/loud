# Runs before E8: a complete short run (the 1M range, 114 updates of 4) with E8's curvature damping on the GPU: five
# refreshes of the directions with their float32 curvature passes, the per-update noise and the damped steps. Its
# metrics also time a refresh on the real model. A few minutes.
experiment: verify
variant: curvature_smoke
task: proxy
seeds: [0]
priority: 3
after: [verify.smoke.s0]
args:
  recipe: boostcut
  sequences: 1M
  heldout: 32
  batch: 4
  per_sequence_grads: true
  curvature_damping: 30.0
  damp_every: 25
notes: Pipeline check only; its numbers are not a result.
