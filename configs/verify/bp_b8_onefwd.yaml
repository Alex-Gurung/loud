# loud.proxy with each batch in one forward, exactly as the unmodified script runs in one process (bp_b8_script):
# verify.bp_b8_match checks that their per-update losses agree, which tests the port's model, init, optimizer,
# schedule and order. Its step time against verify.bp_b8's also says whether one forward per batch is a faster
# stand-in for the one-sequence-per-GPU layout.
experiment: verify
variant: bp_b8_onefwd
task: proxy
seeds: [0]
priority: 10
after: [verify.smoke.s0]
args:
  recipe: boostcut
  sequences: 10M
  heldout: 0
  batch: 8
  micro_batch: 8
expect:
  val_loss: [3.7083, 0.01]
  test_loss: [3.7014, 0.01]
