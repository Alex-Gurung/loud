# Runs before E11, E8 on the Cut chain and E7's self-check: a complete short run (96 sequences: 64 feed 16 updates of
# 4, 3 of them Boost) through E11's runway probes (the chain kernel's output-stream path) and fits, E7's partial cycle
# at 128 tiled rows with its self-check (a threshold of 0 raises the rows at every Cut update, so every shape it can
# reach runs) and E8's damping with its curvature refreshes. About 25 minutes on one H100, mostly warmup and merge.
experiment: verify
variant: cut_variants_smoke
task: cut
seeds: [0]
priority: 4
after: [verify.cut_smoke.s0]
args:
  sequences: 96
  heldout: 32
  batch: 4
  rows: 128
  rows_tiled: true
  rows_check: 0.000001
  target_damping: 0.1
  curvature_damping: 30.0
  damp_every: 4
  checkpoints: true
notes: Pipeline check only; its numbers are not a result.
