# Runs before E3: a complete short local-SGD population on the 1M range (11 updates of 8 before the branch, then 4
# copies at local batch 2 for 46 updates) through the select rule (held-out scoring, copying weights and optimizer
# state), the midpoint log and official scoring.
experiment: verify
variant: population_smoke
task: population
seeds: [0]
priority: 3
after: [verify.smoke.s0]
args:
  recipe: boostcut
  sequences: 1M
  heldout: 32
  batch: 8
  rule: select
  every: 10
notes: Pipeline check only; its numbers are not a result.
