# E1: backprop proxy at 8 sequences per update, the anchor for 3.708 (about 3.71 here, with the last 32 sequences of
# the order held out, as in every experiment cell). Seed 0 keeps the H4 checkpoints, with ANVIL II's state, for the
# diagnostics run on backprop checkpoints.
experiment: e1
variant: bp_b8
task: proxy
seeds: [0, 1, 2]
priority: 50
after: [verify.score_record.s0, verify.bp_b8.s0, verify.bp_b8_match.s0, verify.bp_b8_ledger.s0]
args:
  recipe: boostcut
  sequences: 10M
  heldout: 32
  batch: 8
  heldout_every: 50
  checkpoints: [0]
  checkpoint_optimizer: true
