# E1: backprop proxy at batch 8 (606 updates), the anchor for 3.708 and the baseline of every proxy experiment (E2,
# E3, E4, E8, E9). The last 32 sequences of the order are held out (H3), so baselines and arms train on the same
# 4,848 sequences; expected about 3.71. Its H4 checkpoints, with ANVIL II's state (for the pending update), are the
# proxy's diagnostic checkpoints (H6's snr_spectrum for E8).
experiment: e1
variant: bp_b8
task: proxy
seeds: [0, 1, 2]
priority: 50
after: [verify.score_record.s0, verify.bp_b8.s0, verify.bp_b8_match.s0, verify.bp_b8_ledger.s0]
args:
  recipe: boostcut
  sequences: 10M
  heldout: 32
  batch: 8
  heldout_every: 50
  checkpoints: true
  checkpoint_optimizer: true
