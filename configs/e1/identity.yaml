# E1: the identity-path forward-only estimator (PR #26, unchanged) for a full 10M epoch, seed 0. Like every
# experiment cell it holds out the last 32 sequences; verify.identity is the published layout (no held-out split).
experiment: e1
variant: identity
task: identity
seeds: [0]
priority: 50
after: [verify.score_record.s0, verify.identity.s0, verify.identity_match.s0]
args:
  sequences: 10M
  heldout: 32
  batch: 8
  heldout_every: 50
  checkpoints: true
  means: true
