# E1: backprop proxy at batch 4 (1,212 updates) with the same rates: the upper end of the bracket for the H8
# experiments, which follow the 10M record's recipe at 4 sequences per update.
experiment: e1
variant: bp_b4
task: proxy
seeds: [0, 1, 2]
priority: 50
after: [verify.score_record.s0, verify.bp_b8.s0, verify.bp_b8_match.s0, verify.bp_b8_ledger.s0]
args:
  final_dtype: float32  # exact: verifications and baselines keep their scored weights
  recipe: boostcut
  sequences: 10M
  heldout: 32
  batch: 4
  heldout_every: 100
