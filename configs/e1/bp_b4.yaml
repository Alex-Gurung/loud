# E1: backprop proxy at 4 sequences per update with the same (boost-cut's) rates: the upper end of the bracket for the
# H8 experiments, which run at the 10M record's 4 sequences per update.
experiment: e1
variant: bp_b4
task: proxy
seeds: [0, 1, 2]
priority: 50
after: [verify.score_record.s0, verify.bp_b8.s0, verify.bp_b8_match.s0, verify.bp_b8_ledger.s0]
args:
  recipe: boostcut
  sequences: 10M
  heldout: 32
  batch: 4
  heldout_every: 100
