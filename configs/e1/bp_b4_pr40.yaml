# E1: backprop at batch 4 with PR #40's own recipe (the batch-4 record: lr 0.0021, betas (0.5, 0.98), warmdown 0.4 to
# 30%, head std 0.02, ANVIL II 0.026, fast weight 1.0). bp_b4 runs boost-cut's batch-8 rates at batch 4, which no
# published run anchors; this cell says how much the recipe matters before either is used as the batch-4 baseline.
experiment: e1
variant: bp_b4_pr40
task: proxy
seeds: [0, 1, 2]
priority: 50
after: [verify.score_record.s0, verify.bp_b8.s0, verify.bp_b8_match.s0, verify.bp_b8_ledger.s0]
args:
  recipe: pr40
  sequences: 10M
  heldout: 32
  batch: 4
  means: true
  heldout_every: 100
  checkpoints: true
