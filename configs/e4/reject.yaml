# E4: measured step control (v2), against e1.bp_b8. Each update is judged on 4 of the 32 held-out sequences
# (rotating), under the old and the new weights: a paired comparison costing 2 forwards of 4 sequences, never on the
# producing batch. This arm: v1, zero knobs: if the held-out loss rose, the weights and optimizer state go back and
# the batch feeds no update. Logs per update: accepted, heldout_before, heldout_after, lr_multiplier and the effective
# rates. Success: adapt_nowd matches e1.bp_b8 within noise, a recipe that retunes itself when the token count changes.
experiment: e4
variant: reject
task: proxy
seeds: [0, 1, 2]
priority: 55
after: [verify.score_record.s0, verify.bp_b8.s0, verify.bp_b8_match.s0, verify.bp_b8_ledger.s0,
        verify.step_control_smoke.s0]
args:
  recipe: boostcut
  sequences: 10M
  heldout: 32
  batch: 8
  heldout_every: 50
  step_control: reject
