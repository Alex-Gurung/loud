# E4: accept-or-reject steps, against the batch-8 baseline e1.bp_b8. After every update, one no-grad forward scores the
# same batch at the new weights; if its loss rose, the weights and the whole optimizer state go back to before the
# update, and that batch feeds no update.
# Version two with the plan's factors: every rate times a global multiplier, x1.05 after an accept and x0.8 after a
# reject, the hand warmdown underneath. These factors settle at about 82% acceptance, not the plan's stated 0.6
# (ln 1.25 / (ln 1.05 + ln 1.25)); adapt_t60 has the factor for 0.6. Logs: accepted, lr_multiplier, lr (effective).
experiment: e4
variant: adapt
task: proxy
seeds: [0, 1, 2]
priority: 55
after: [verify.score_record.s0, verify.bp_b8.s0, verify.bp_b8_match.s0, verify.bp_b8_ledger.s0]
args:
  recipe: boostcut
  sequences: 10M
  heldout: 32
  batch: 8
  means: true
  heldout_every: 50
  checkpoints: true
  step_control: adapt
  accept_up: 1.05
  accept_down: 0.8
