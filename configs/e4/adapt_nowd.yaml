# E4: accept-or-reject steps, against the batch-8 baseline e1.bp_b8. After every update, one no-grad forward scores the
# same batch at the new weights; if its loss rose, the weights and the whole optimizer state go back to before the
# update, and that batch feeds no update.
# Version two (the plan's factors) with the warmdown removed: constant base rates, so the multiplier alone shapes the
# end of training. Success, the point of E4: matches the tuned baseline e1.bp_b8 within noise, a recipe that retunes
# itself when the token count changes. One seed, as the plan asks.
experiment: e4
variant: adapt_nowd
task: proxy
seeds: [0]
priority: 55
after: [verify.score_record.s0, verify.bp_b8.s0, verify.bp_b8_match.s0, verify.bp_b8_ledger.s0,
        verify.step_control_smoke.s0]
args:
  recipe: boostcut
  sequences: 10M
  heldout: 32
  batch: 8
  means: true
  heldout_every: 50
  checkpoints: true
  step_control: adapt
  accept_up: 1.05
  accept_down: 0.8
  warmdown: 0
