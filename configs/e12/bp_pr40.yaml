# E12 on one GPU: backprop on the 30M set with record #2's (PR #40's recipe reused on 30M, 3.409) exact optimizer,
# rates, schedule, init and batch 4: the fair baseline for the 3.409 record (the README's 3.340 used a few learning
# rates). About 15 min on one H100. With the record's own end merge, so val_loss compares with the record's and
# val_loss_plain with its plain weights.
experiment: e12
variant: bp_pr40
task: proxy
seeds: [0, 1, 2]
priority: 55
after: [verify.score_record.s0, verify.bp_b8.s0, verify.bp_b8_match.s0, verify.bp_b8_ledger.s0]
args:
  recipe: pr40
  sequences: 30M
  heldout: 32
  batch: 4
  means: true
  end_merge: true
  heldout_every: 200
