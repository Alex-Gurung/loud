# E12's reproduction check: seed 0 of the record on this node against PR #46's published 8-GPU log (same script,
# seed, layout and data; torch 2.13 here, 2.10 there). The first 50 updates' training losses (Boost) and the final
# validation loss must agree; the re-tunes wait for it.
experiment: e12
variant: record_match
task: compare
seeds: [0]
priority: 90
after_done: [e12.record.s0]  # runs even when the record's loss is off: it says where the runs part
args:
  a: e12.record.s0
  b: [noise, train/val/log/metrics.jsonl]
  first: 50
expect:
  train_loss_max_diff: [0, 0.005]
  val_loss_diff: [0, 0.01]
