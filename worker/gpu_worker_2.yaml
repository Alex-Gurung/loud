# Noise harness GPU worker for a two-GPU pod: two workers, each pinned to one of the pod's H100s
# (CUDA_VISIBLE_DEVICES) and running one-GPU jobs from /mnt/disk/loud/artifacts/queue one at a time, as two
# gpu_worker.yaml pods would. Otherwise the same as gpu_worker.yaml (see there).
#
#   kubectl -n eidf107ns create -f worker/gpu_worker_2.yaml
#
# EIDF does not support ephemeral-storage requests or limits.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: alexgurung-loud-worker2-
  labels:
    eidf/user: alexgurung
    kueue.x-k8s.io/queue-name: eidf107ns-user-queue
    kueue.x-k8s.io/priority-class: batch-workload-priority
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        eidf/user: alexgurung
        loud/experiment: noise-harness
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-H100-80GB-HBM3]
      containers:
        - name: loud-worker
          image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
          imagePullPolicy: IfNotPresent
          workingDir: /mnt/disk/loud
          command: ["/bin/bash", "-lc"]
          args:
            - |
              exec bash /mnt/disk/loud/worker/launch_worker.sh
          env:
            - name: LOUD_RUNTIME_IMAGE
              value: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
            - name: LOUD_REPO
              value: /mnt/disk/loud
            - name: LOUD_QUEUE_DIR
              value: /mnt/disk/loud/artifacts/queue
            - name: LOUD_WORKERS_PER_POD
              value: "2"
            - name: LOUD_IDLE_EXIT_SECONDS
              value: "1200"
            - name: LOUD_MIN_FREE_GB
              value: "15"  # headroom for the other projects on this volume
            - name: OMP_NUM_THREADS
              value: "8"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "2"
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: disk
              mountPath: /mnt/disk
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: disk
          persistentVolumeClaim:
            claimName: alexgurung-explore2
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
