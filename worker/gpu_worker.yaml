# Noise harness GPU worker: one H100 or H200, running LOUD_JOBS_PER_GPU queued jobs at a time from
# /mnt/disk/loud/artifacts/queue. The stylo worker pattern: launched by the user from the root node, shared PVC,
# pinned image, no package installation or download at startup. Exits by itself after LOUD_IDLE_EXIT_SECONDS with
# nothing to run.
#
#   kubectl -n eidf107ns create -f worker/gpu_worker.yaml      # once per GPU wanted
#
# The image is stylo's vLLM 0.32.0 runtime (torch 2.13, Triton, PyYAML), used only for its PyTorch stack; every run
# records the versions and its GPU. Either GPU type is fine: the experiments compare losses, not wall-clocks
# (collect.py flags variants whose seeds ran on mixed GPUs). For a timing comparison, pin the configs with `gpu: H100`
# and set LOUD_JOBS_PER_GPU to 1.
# EIDF does not support ephemeral-storage requests or limits.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: alexgurung-loud-worker-
  labels:
    eidf/user: alexgurung
    loud/role: worker  # kubectl -n eidf107ns delete job -l loud/role=worker stops every loud worker, nothing else
    kueue.x-k8s.io/queue-name: eidf107ns-user-queue
    kueue.x-k8s.io/priority-class: batch-workload-priority
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        eidf/user: alexgurung
        loud/experiment: noise-harness
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-H100-80GB-HBM3, NVIDIA-H200]  # either: no job is judged on wall-clock
      containers:
        - name: loud-worker
          image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
          imagePullPolicy: IfNotPresent
          workingDir: /mnt/disk/loud
          command: ["/bin/bash", "-lc"]
          args:
            - |
              exec bash /mnt/disk/loud/worker/launch_worker.sh
          env:
            - name: LOUD_RUNTIME_IMAGE
              value: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
            - name: LOUD_REPO
              value: /mnt/disk/loud
            - name: LOUD_QUEUE_DIR
              value: /mnt/disk/loud/artifacts/queue
            - name: LOUD_IDLE_EXIT_SECONDS
              value: "1200"
            - name: LOUD_JOBS_PER_GPU
              value: "4"  # jobs sharing each GPU (1: one at a time, for wall-clock comparisons)
            - name: LOUD_MIN_FREE_GB
              value: "15"  # headroom for the other projects on this volume
            - name: OMP_NUM_THREADS
              value: "8"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: disk
              mountPath: /mnt/disk
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: disk
          persistentVolumeClaim:
            claimName: alexgurung-explore2
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
