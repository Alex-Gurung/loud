# Noise harness 8-GPU worker: one 8 x H100 node for E12's record runs (jobs with `gpus: 8`, run under torchrun). It
# claims only 8-GPU jobs, so it never idles seven GPUs on a one-GPU job; start it only when such jobs are ready.
# Otherwise as worker/gpu_worker.yaml (one H100), which runs queued jobs from /mnt/disk/loud/artifacts/queue one at a time.
# The stylo worker pattern: launched by the user from the root node, shared PVC, pinned image, no package
# installation or download at startup. Exits by itself after LOUD_IDLE_EXIT_SECONDS with nothing to run.
#
#   kubectl -n eidf107ns create -f worker/gpu_worker_8.yaml
#
# The image is stylo's vLLM 0.32.0 runtime (torch 2.13, Triton, PyYAML), used only for its PyTorch stack; every run
# records the versions. Hardware is pinned to H100 80GB so wall-clocks are comparable across runs; see
# gpu_worker_any.yaml to also accept H200 (collect.py flags variants whose seeds ran on mixed GPUs).
# EIDF does not support ephemeral-storage requests or limits.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: alexgurung-loud-worker8-
  labels:
    eidf/user: alexgurung
    kueue.x-k8s.io/queue-name: eidf107ns-user-queue
    kueue.x-k8s.io/priority-class: batch-workload-priority
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        eidf/user: alexgurung
        loud/experiment: noise-harness
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-H100-80GB-HBM3]
      containers:
        - name: loud-worker
          image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
          imagePullPolicy: IfNotPresent
          workingDir: /mnt/disk/loud
          command: ["/bin/bash", "-lc"]
          args:
            - |
              exec bash /mnt/disk/loud/worker/launch_worker.sh
          env:
            - name: LOUD_RUNTIME_IMAGE
              value: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
            - name: LOUD_REPO
              value: /mnt/disk/loud
            - name: LOUD_QUEUE_DIR
              value: /mnt/disk/loud/artifacts/queue
            - name: LOUD_IDLE_EXIT_SECONDS
              value: "1200"
            - name: LOUD_MIN_FREE_GB
              value: "15"  # headroom for the other projects on this volume
            - name: OMP_NUM_THREADS
              value: "8"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "32"
              memory: 512Gi
              nvidia.com/gpu: "8"
            limits:
              cpu: "32"
              memory: 512Gi
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: disk
              mountPath: /mnt/disk
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: disk
          persistentVolumeClaim:
            claimName: alexgurung-explore2
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
